name: Android Build (Release APK)

on:
  workflow_dispatch:

env:
  EAS_USE_CACHE: '1'
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPILERCHECK: content
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 ndk;27.1.12297006 platform-tools'

      - name: Cache Gradle and npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.npm
          key: ${{ runner.os }}-gradle-npm-${{ hashFiles('package-lock.json', 'app.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-npm-

      - name: Cache C++ compilation
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-ccache-

      - name: Set up ccache
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ccache
          mkdir -p "$CCACHE_DIR"
          ccache --max-size "$CCACHE_MAXSIZE"
          ccache --zero-stats

      - name: Install npm dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chertilla-alpha-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
